<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Плейлист из 30 видео</title>
</head>
<body style="margin:0; background:#000; color:white; font-family:sans-serif;">

<h2 style="padding:20px;">Обучающий курс: видео 1–30</h2>

<video id="videoPlayer" width="100%" height="800" controls controlsList="nodownload nofullscreen noremoteplayback">
  <source src="video1.mp4" type="video/mp4">
  Ваш браузер не поддерживает видео.
</video>

<script>
  const videoFiles = ["video1.mp4", "video2.mp4", "video3.mp4", "video4.mp4", "video5.mp4", "video6.mp4", "video7.mp4", "video8.mp4", "video9.mp4", "video10.mp4", "video11.mp4", "video12.mp4", "video13.mp4", "video14.mp4", "video15.mp4", "video16.mp4", "video17.mp4", "video18.mp4", "video19.mp4", "video20.mp4", "video21.mp4", "video22.mp4", "video23.mp4", "video24.mp4", "video25.mp4", "video26.mp4", "video27.mp4", "video28.mp4", "video29.mp4", "video30.mp4"];
  let index = 0;
  const player = document.getElementById("videoPlayer");

  player.addEventListener("ended", () => {
    index++;
    if (index < videoFiles.length) {
      player.src = videoFiles[index];
      player.load();
      player.play();
    }
  });
</script>

</body>
</html>
